<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Booking | Sri Kala Bhairava Holidays</title><style>body{font-family:Arial;margin:0;color:#123}main{max-width:700px;margin:auto;padding:45px 20px}form{display:grid;gap:14px}input,select{padding:13px;border:1px solid #ccd6db;border-radius:10px}button{border:0;padding:13px 18px;border-radius:999px;background:#10a89e;color:#fff}.msg{display:none;background:#f0faf8;padding:15px;border-radius:10px}a{color:#0d958c}</style></head><body><main><p><a href="index.html">← Home</a></p><h1>Booking Request</h1><form id="b"><input required name="name" placeholder="Lead traveller"><input required type="tel" name="phone" placeholder="Phone"><input name="trip" placeholder="Tour/package"><input type="date" name="date"><input name="travellers" placeholder="Travellers"><select name="vehicle"><option>Vehicle preference</option><option>Sedan</option><option>SUV</option><option>Group vehicle</option></select><button type="submit">Request Booking</button></form><div class="msg" id="m">Booking request saved in this browser demo.</div></main><script>document.getElementById('b').addEventListener('submit',e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));const key='skbh_bookings';const arr=JSON.parse(localStorage.getItem(key)||'[]');arr.push({...d,createdAt:new Date().toISOString()});localStorage.setItem(key,JSON.stringify(arr));e.target.reset();document.getElementById('m').style.display='block'});</script></body></html>
