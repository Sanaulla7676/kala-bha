<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Get a Quote | Sri Kala Bhairava Holidays</title><style>body{font-family:Arial;margin:0;color:#123}main{max-width:700px;margin:auto;padding:45px 20px}form{display:grid;gap:14px}input,textarea,select{padding:13px;border:1px solid #ccd6db;border-radius:10px}button{border:0;padding:13px 18px;border-radius:999px;background:#10a89e;color:#fff;cursor:pointer}.msg{display:none;background:#f0faf8;padding:15px;border-radius:10px}a{color:#0d958c}</style></head><body><main><p><a href="index.html">← Home</a></p><h1>Request a Travel Quote</h1><p>Tell us your route, dates and group size. We will help shape the trip.</p><form id="q"><input required name="name" placeholder="Your name"><input required type="tel" name="phone" placeholder="Phone number"><input type="email" name="email" placeholder="Email"><input name="destination" placeholder="Destination"><input name="travelDates" placeholder="Travel dates"><input name="travellers" placeholder="Number of travellers"><select name="vehicle"><option>Need vehicle rental</option><option>Yes - sedan</option><option>Yes - SUV</option><option>Yes - group vehicle</option><option>No</option></select><textarea name="message" rows="5" placeholder="Tell us about your trip"></textarea><button type="submit">Submit Quote Request</button></form><div class="msg" id="m">Thanks. Your enquiry has been saved in this browser demo.</div></main><script>document.getElementById('q').addEventListener('submit',e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));const key='skbh_leads';const arr=JSON.parse(localStorage.getItem(key)||'[]');arr.push({...d,createdAt:new Date().toISOString()});localStorage.setItem(key,JSON.stringify(arr));e.target.reset();document.getElementById('m').style.display='block'});</script></body></html>
